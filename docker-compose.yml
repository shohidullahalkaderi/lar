services:
  app:
    build: .
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
    ports:
      - "8080:8000"
    environment:
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-laravel_db}
      - DB_USERNAME=${DB_USERNAME:-laravel_user}
      - DB_PASSWORD=${DB_PASSWORD:-laravel_password}
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 0 8000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  db:
    image: mysql:8.0
    container_name: laravel_mysql_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-laravel_db}
      - MYSQL_USER=${DB_USERNAME:-laravel_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-laravel_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_ROOT_HOST="127.0.0.1"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - laravel_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" || exit 1"]
      timeout: 5s
      retries: 5
      interval: 10s
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: laravel_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  laravel_db_data:
  redis_data: