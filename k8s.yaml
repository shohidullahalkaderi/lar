apiVersion: v1
kind: Secret
metadata:
  name: laravel-secrets
  labels:
    app.kubernetes.io/name: laravel-app
type: Opaque
# NOTE: Plaintext credentials in stringData are only base64-encoded at rest,
# not encrypted. Fine for local kind/Docker Desktop, but before a real
# production apply these should come from `kubectl create secret` off an
# untracked env file, or a secrets manager (Sealed Secrets / External
# Secrets Operator / SOPS) instead of being committed here.
stringData:
  DB_PASSWORD: "laravel_password"
  MYSQL_ROOT_PASSWORD: "root_password"
  REDIS_PASSWORD: "password_secure"

---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    io.kompose.service: app

---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    io.kompose.service: db

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    io.kompose.service: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: app
    spec:
      # Matches numeric UID/GID 10001 defined in the Dockerfile
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: laravel-app
          image: laravel-app:dev
          # MODIFIED: Always -> IfNotPresent. Same reason as the Django app:
          # this image is built locally for kind/Docker Desktop and never
          # pushed to a registry, so Always caused ErrImagePull/
          # ImagePullBackOff. IfNotPresent uses the image already loaded
          # into the cluster's local store. Switch to Always + an immutable
          # tag (e.g. git SHA) pushed to a real registry for actual prod.
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_DATABASE
              value: "laravel_db"
            - name: DB_USERNAME
              value: "laravel_user"
            - name: DB_PORT
              value: "3306"
            - name: REDIS_CLIENT
              value: "phpredis"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            # [30-second SSE streaming setup]: Set to 35s. Since streams recycle every 30 seconds, 
            # we give it a tiny buffer past 30s before the liveness check starts.
            initialDelaySeconds: 35
            # [30-second SSE streaming setup]: 15-second intervals give worker threads enough breathing room 
            # during heavy concurrent stream requests.
            periodSeconds: 15
            timeoutSeconds: 5
            # [30-second SSE streaming setup]: A threshold of 4 means Kubelet waits 4 consecutive failures 
            # (15s * 4 = 60 seconds of unresponsiveness) before killing the pod.
            failureThreshold: 4
          restartPolicy: Always

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  labels:
    io.kompose.service: db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: laravel-mysql-db
          image: mysql:8.0
          # No imagePullPolicy override — defaults to IfNotPresent, correct
          # for a fixed, versioned upstream tag.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: MYSQL_DATABASE
              value: "laravel_db"
            - name: MYSQL_USER
              value: "laravel_user"
            - name: MYSQL_ROOT_HOST
              value: "127.0.0.1"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              # Invoked sh -c to expand $MYSQL_ROOT_PASSWORD properly during
              # liveness checks
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: laravel-db-data
      restartPolicy: Always
      volumes:
        - name: laravel-db-data
          persistentVolumeClaim:
            claimName: laravel-db-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: laravel-db-data
  labels:
    io.kompose.service: laravel-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: laravel-redis
          image: redis:7.2-alpine
          # No imagePullPolicy override — same reasoning as db.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secrets
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - mountPath: /data
              name: redis-data
      restartPolicy: Always
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels:
    io.kompose.service: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi